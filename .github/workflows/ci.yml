name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: python3 -m pip install pillow # test du client Pi (pi/client.py) avec un faux pilote d'écran
      - run: npm run check
      - run: python3 -m unittest discover pi/tests
